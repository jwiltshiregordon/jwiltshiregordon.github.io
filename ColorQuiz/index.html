<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromata — Color Name Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #F7F3ED;
      --cream-dark: #EDE7DD;
      --ink: #1C1814;
      --ink-muted: #6B6359;
      --ink-faint: #A8A09A;
      --accent: #C8492A;
      --accent-light: #F2DDD8;
      --green: #2D7A5E;
      --green-light: #D6EDE6;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Header ── */
    header {
      padding: 2.5rem 0 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 16px;
      border-bottom: 1px solid rgba(28,24,20,0.1);
    }
    .logo {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .logo em {
      font-style: italic;
      color: var(--accent);
    }
    .tagline {
      font-size: 13px;
      color: var(--ink-faint);
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .mode-tabs {
      margin-left: auto;
      display: flex;
      gap: 4px;
      background: var(--cream-dark);
      border-radius: 99px;
      padding: 3px;
    }
    .tab-btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
      padding: 5px 14px;
      border-radius: 99px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-muted);
      transition: background 0.18s, color 0.18s;
    }
    .tab-btn.active {
      background: var(--ink);
      color: var(--cream);
    }

    /* ── Main ── */
    main { padding: 2rem 0; }

    /* ── Quiz mode ── */
    #quiz-mode { animation: fadeIn 0.25s ease; }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 1.25rem;
    }
    .meta-chip {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .meta-chip strong { color: var(--ink); font-weight: 500; }

    .progress-track {
      flex: 1;
      height: 2px;
      background: var(--cream-dark);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Swatch */
    .swatch-frame {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      height: 220px;
      margin-bottom: 1.5rem;
      transition: background 0.4s ease;
      box-shadow: inset 0 0 0 1px rgba(28,24,20,0.08);
    }
    .domain-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(247,243,237,0.88);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink);
      padding: 4px 12px;
      border: 1px solid rgba(28,24,20,0.08);
    }
    .hex-badge {
      position: absolute;
      bottom: 14px;
      right: 14px;
      font-family: monospace;
      font-size: 12px;
      color: rgba(247,243,237,0.7);
      background: rgba(28,24,20,0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 6px;
      padding: 4px 10px;
      transition: opacity 0.2s;
    }
    .hex-badge.hidden { opacity: 0; }

    /* Clue */
    .clue {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
      min-height: 60px;
    }
    .clue strong { color: var(--ink); font-style: normal; }

    /* Choices */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .choice {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 500;
      padding: 14px 18px;
      border: 1px solid rgba(28,24,20,0.15);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .choice:hover { background: var(--cream-dark); border-color: rgba(28,24,20,0.25); }
    .choice:active { transform: scale(0.99); }
    .choice.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
    .choice.wrong { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .choice.disabled { pointer-events: none; }

    /* Feedback */
    .feedback {
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink-muted);
      min-height: 42px;
      margin-bottom: 1.25rem;
    }
    .feedback.win { color: var(--green); }
    .feedback.lose { color: var(--accent); }

    /* Next btn */
    .action-row { display: flex; gap: 10px; align-items: center; }
    .btn-primary {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 22px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 99px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 22px;
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid rgba(28,24,20,0.15);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-ghost:hover { background: var(--cream-dark); }
    .hidden { display: none !important; }

    /* Final screen */
    .final {
      text-align: center;
      padding: 3rem 1rem;
      animation: fadeIn 0.35s ease;
    }
    .final-score {
      font-family: var(--serif);
      font-size: 5rem;
      font-weight: 600;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }
    .final-denom { font-size: 2rem; color: var(--ink-faint); }
    .final-label {
      font-size: 1.1rem;
      font-family: var(--serif);
      font-style: italic;
      color: var(--ink-muted);
      margin-bottom: 2rem;
    }

    /* ── Gallery mode ── */
    #gallery-mode { animation: fadeIn 0.25s ease; }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-chip {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 99px;
      border: 1px solid rgba(28,24,20,0.15);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .filter-chip.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .g-card {
      border-radius: 10px;
      border: 1px solid rgba(28,24,20,0.09);
      overflow: hidden;
      background: white;
      transition: transform 0.18s, box-shadow 0.18s;
      cursor: default;
    }
    .g-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(28,24,20,0.08); }
    .g-swatch { height: 80px; }
    .g-body { padding: 10px 12px 12px; }
    .g-name {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .g-hex {
      font-family: monospace;
      font-size: 11px;
      color: var(--ink-faint);
    }
    .g-domain {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 4px;
    }
    .g-clue {
      font-family: var(--serif);
      font-size: 0.82rem;
      font-style: italic;
      color: var(--ink-muted);
      margin-top: 6px;
      line-height: 1.5;
      border-top: 1px solid rgba(28,24,20,0.07);
      padding-top: 6px;
    }

    /* ── Footer ── */
    footer {
      padding: 1.5rem 0;
      border-top: 1px solid rgba(28,24,20,0.08);
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 520px) {
      .logo { font-size: 1.5rem; }
      .tagline { display: none; }
      .swatch-frame { height: 160px; }
      .choices { grid-template-columns: 1fr; }
      .final-score { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <span class="logo">Chrom<em>ata</em></span>
    <span class="tagline">Colors of art, fashion &amp; literature</span>
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-quiz" onclick="setMode('quiz')">Quiz</button>
      <button class="tab-btn" id="tab-gallery" onclick="setMode('gallery')">Browse</button>
    </div>
  </header>

  <!-- Main -->
  <main>

    <!-- Quiz mode -->
    <div id="quiz-mode">
      <div class="meta-row">
        <span class="meta-chip">Score&nbsp; <strong id="score-val">0</strong></span>
        <span class="meta-chip"><strong id="q-num">1</strong> / <strong id="q-total">20</strong></span>
        <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:5%"></div></div>
      </div>

      <div class="swatch-frame" id="swatch">
        <span class="domain-badge" id="domain-badge">Art</span>
        <span class="hex-badge hidden" id="hex-badge">#000000</span>
      </div>

      <p class="clue" id="clue">Loading...</p>

      <div class="choices" id="choices"></div>

      <p class="feedback" id="feedback"></p>

      <div class="action-row">
        <button class="btn-primary hidden" id="next-btn" onclick="nextQ()">Next →</button>
        <button class="btn-ghost hidden" id="restart-btn" onclick="restartQuiz()">Play again</button>
      </div>
    </div>

    <!-- Gallery mode -->
    <div id="gallery-mode" class="hidden">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all" onclick="filterGallery('all', this)">All</button>
        <button class="filter-chip" data-filter="Art" onclick="filterGallery('Art', this)">Art</button>
        <button class="filter-chip" data-filter="Fashion" onclick="filterGallery('Fashion', this)">Fashion</button>
        <button class="filter-chip" data-filter="Literature" onclick="filterGallery('Literature', this)">Literature</button>
      </div>
      <div class="gallery" id="gallery-grid"></div>
    </div>

  </main>

  <footer>30 colors · art, fashion &amp; literature · chromata</footer>
</div>

<script>
const COLORS = [
  { name: "Vermilion",    hex: "#E34234", domain: "Art",                clue: "A vivid red-orange used by masters like Turner and Titian" },
  { name: "Celadon",      hex: "#ACE1AF", domain: "Art",                clue: "A pale green glaze prized in East Asian ceramics" },
  { name: "Carmine",      hex: "#960018", domain: "Art & Fashion",      clue: "A deep crimson extracted from cochineal insects" },
  { name: "Saffron",      hex: "#F4C430", domain: "Fashion",            clue: "A golden yellow associated with Buddhist robes and spice markets" },
  { name: "Ecru",         hex: "#C2B280", domain: "Fashion",            clue: "An unbleached linen tone — raw, warm, and neutral" },
  { name: "Cobalt",       hex: "#0047AB", domain: "Art",                clue: "An intense blue made famous by Yves Klein" },
  { name: "Umber",        hex: "#635147", domain: "Art",                clue: "A natural brown earth pigment, raw or burnt, beloved in oil painting" },
  { name: "Gamboge",      hex: "#E49B0F", domain: "Art",                clue: "A resinous yellow-orange used in medieval manuscripts" },
  { name: "Aubergine",    hex: "#614051", domain: "Fashion",            clue: "A deep purple-black named after the eggplant" },
  { name: "Viridian",     hex: "#40826D", domain: "Art",                clue: "A cool, transparent green made popular by the Impressionists" },
  { name: "Bisque",       hex: "#FFE4C4", domain: "Fashion",            clue: "A pale pinkish beige, soft as unglazed porcelain" },
  { name: "Chartreuse",   hex: "#7FFF00", domain: "Art & Fashion",      clue: "A yellow-green named after a French liqueur" },
  { name: "Puce",         hex: "#CC8899", domain: "Fashion",            clue: "A dusty mauve-pink — its name is French for 'flea'" },
  { name: "Scarlet",      hex: "#FF2400", domain: "Literature",         clue: "The bold red of a certain letter in Hawthorne's classic" },
  { name: "Cerulean",     hex: "#2A52BE", domain: "Art",                clue: "A vivid sky blue described famously in The Devil Wears Prada" },
  { name: "Russet",       hex: "#80461B", domain: "Literature",         clue: "A reddish-brown worn by English peasants in medieval literature" },
  { name: "Amaranth",     hex: "#9F2B68", domain: "Literature",         clue: "An everlasting flower's purple-red, found in Greek myth and poetry" },
  { name: "Mauve",        hex: "#E0B0FF", domain: "Fashion",            clue: "The first synthetic dye, discovered in 1856, kicked off the purple fashion craze" },
  { name: "Titian",       hex: "#B5651D", domain: "Art",                clue: "A reddish auburn named after the Venetian Renaissance painter" },
  { name: "Cinnabar",     hex: "#E34234", domain: "Art",                clue: "A mercury-red pigment used in Chinese lacquerware and ancient frescoes" },
  { name: "Alabaster",    hex: "#F2F0E6", domain: "Literature",         clue: "A luminous off-white describing smooth, pale skin in poetry" },
  { name: "Ochre",        hex: "#CC7722", domain: "Art",                clue: "A yellow-brown earth pigment used since prehistoric cave paintings" },
  { name: "Prussian Blue",hex: "#003153", domain: "Art",                clue: "The first modern synthetic pigment, created accidentally in 1704" },
  { name: "Ivory",        hex: "#FFFFF0", domain: "Literature & Fashion",clue: "A warm near-white evoking bone and piano keys" },
  { name: "Alizarin",     hex: "#E32636", domain: "Art",                clue: "The first synthetic dye from coal tar — a rich crimson red" },
  { name: "Sage",         hex: "#BCB88A", domain: "Fashion",            clue: "A muted, silvery green named after the herb" },
  { name: "Parchment",    hex: "#F1E9D2", domain: "Literature",         clue: "A warm antique cream — the color of old manuscripts and scrolls" },
  { name: "Bordeaux",     hex: "#5C0120", domain: "Fashion",            clue: "A deep wine red named after France's great wine region" },
  { name: "Indigo",       hex: "#4B0082", domain: "Art & Fashion",      clue: "A plant-based blue-violet, the backbone of denim worldwide" },
  { name: "Gilt",         hex: "#FFD700", domain: "Literature",         clue: "A brilliant gold found on gilded pages and opulent decor in Victorian novels" }
];

/* ─── Helpers ─── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ─── Mode toggle ─── */
function setMode(m) {
  const isQuiz = m === 'quiz';
  document.getElementById('quiz-mode').classList.toggle('hidden', !isQuiz);
  document.getElementById('gallery-mode').classList.toggle('hidden', isQuiz);
  document.getElementById('tab-quiz').classList.toggle('active', isQuiz);
  document.getElementById('tab-gallery').classList.toggle('active', !isQuiz);
  if (!isQuiz) renderGallery('all');
}

/* ─── Gallery ─── */
function renderGallery(filter) {
  const list = filter === 'all' ? COLORS : COLORS.filter(c => c.domain.includes(filter));
  const sorted = [...list].sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('gallery-grid').innerHTML = sorted.map(c => `
    <div class="g-card">
      <div class="g-swatch" style="background:${c.hex}"></div>
      <div class="g-body">
        <div class="g-name">${c.name}</div>
        <div class="g-hex">${c.hex}</div>
        <div class="g-domain">${c.domain}</div>
        <div class="g-clue">${c.clue}</div>
      </div>
    </div>
  `).join('');
}

function filterGallery(f, el) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGallery(f);
}

/* ─── Quiz state ─── */
let order = [], idx = 0, results = [], answered = false;

function startQuiz() {
  order = shuffle(COLORS).slice(0, 20);
  idx = 0; results = []; answered = false;
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.add('hidden');
  renderQ();
}

function renderQ() {
  const c = order[idx];
  answered = false;

  document.getElementById('swatch').style.background = c.hex;
  document.getElementById('domain-badge').textContent = c.domain;
  document.getElementById('hex-badge').textContent = c.hex;
  document.getElementById('hex-badge').classList.add('hidden');
  document.getElementById('clue').innerHTML = c.clue;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('q-num').textContent = idx + 1;
  document.getElementById('q-total').textContent = order.length;
  document.getElementById('score-val').textContent = results.filter(Boolean).length;
  document.getElementById('prog-fill').style.width = Math.max(5, Math.round((idx / order.length) * 100)) + '%';

  const others = shuffle(COLORS.filter(x => x.name !== c.name)).slice(0, 3);
  const pool = shuffle([c, ...others]);
  document.getElementById('choices').innerHTML = pool.map(o =>
    `<button class="choice" onclick="guess('${o.name.replace(/'/g,"\\'")}')">
       ${o.name}
     </button>`
  ).join('');
}

function guess(name) {
  if (answered) return;
  answered = true;
  const c = order[idx];
  const correct = name === c.name;
  results.push(correct);

  document.getElementById('hex-badge').classList.remove('hidden');

  document.querySelectorAll('.choice').forEach(b => {
    const bName = b.textContent.trim();
    b.classList.add('disabled');
    if (bName === c.name) b.classList.add('correct');
    else if (bName === name && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (correct) {
    fb.textContent = `Correct! ${c.name} — ${c.clue}`;
    fb.className = 'feedback win';
  } else {
    fb.textContent = `That's ${c.name}. ${c.clue}`;
    fb.className = 'feedback lose';
  }

  document.getElementById('score-val').textContent = results.filter(Boolean).length;

  if (idx < order.length - 1) {
    document.getElementById('next-btn').classList.remove('hidden');
  } else {
    showFinal();
  }
}

function nextQ() {
  idx++;
  document.getElementById('next-btn').classList.add('hidden');
  renderQ();
}

function showFinal() {
  const right = results.filter(Boolean).length;
  const total = results.length;
  const pct = Math.round(right / total * 100);
  const msg = pct >= 90 ? 'Palette master.' : pct >= 70 ? 'Sharp eye.' : pct >= 50 ? 'Keep mixing.' : 'Keep exploring.';

  document.getElementById('choices').innerHTML = '';
  document.getElementById('clue').innerHTML = '';
  document.getElementById('feedback').innerHTML = `
    <div style="text-align:center; padding: 2.5rem 0;">
      <div style="font-family:var(--serif); font-size:5rem; font-weight:600; line-height:1; color:var(--ink);">
        ${right}<span style="font-size:2rem; color:var(--ink-faint)">/${total}</span>
      </div>
      <div style="font-family:var(--serif); font-style:italic; font-size:1.1rem; color:var(--ink-muted); margin-top:0.5rem;">
        ${pct}% correct &mdash; ${msg}
      </div>
    </div>
  `;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('choices').innerHTML = '';
  startQuiz();
}

/* ─── Init ─── */
startQuiz();
</script>
</body>
</html>
