<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chromata — Color Name Quiz</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/cormorant-italic-400.ttf) format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 500; font-display: swap; src: url(fonts/cormorant-italic-500.ttf) format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/cormorant-normal-400.ttf) format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/cormorant-normal-500.ttf) format('truetype'); }
    @font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/cormorant-normal-600.ttf) format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 300; font-display: swap; src: url(fonts/dmsans-300.ttf) format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/dmsans-400.ttf) format('truetype'); }
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/dmsans-500.ttf) format('truetype'); }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

    :root {
      --cream: #F7F3ED;
      --cream-dark: #EDE7DD;
      --ink: #1C1814;
      --ink-muted: #6B6359;
      --ink-faint: #A8A09A;
      --accent: #C8492A;
      --accent-light: #F2DDD8;
      --green: #2D7A5E;
      --green-light: #D6EDE6;
      --gold: #9A7C2F;
      --gold-light: #F5EDD6;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Header ── */
    header {
      padding: 2.5rem 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid rgba(28,24,20,0.1);
    }
    .logo {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      align-self: baseline;
    }
    .logo em { font-style: italic; color: var(--accent); }
    .tagline {
      font-size: 13px;
      color: var(--ink-faint);
      font-weight: 300;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      align-self: baseline;
    }
    .florin-badge {
      margin-left: auto;
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
      background: var(--gold-light);
      padding: 5px 13px;
      border-radius: 99px;
      white-space: nowrap;
      border: 1px solid rgba(154,124,47,0.2);
      cursor: default;
    }
    .mode-tabs {
      margin-left: 8px;
      display: flex;
      gap: 4px;
      background: var(--cream-dark);
      border-radius: 99px;
      padding: 3px;
    }
    .tab-btn {
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
      padding: 5px 14px;
      border-radius: 99px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--ink-muted);
      transition: background 0.18s, color 0.18s;
    }
    .tab-btn.active { background: var(--ink); color: var(--cream); }

    /* ── Main ── */
    main { padding: 2rem 0; }

    /* ── Quiz mode ── */
    #quiz-mode { animation: fadeIn 0.25s ease; }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 1.25rem;
    }
    .meta-chip {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .meta-chip strong { color: var(--ink); font-weight: 500; }

    .progress-track {
      flex: 1;
      height: 2px;
      background: var(--cream-dark);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--ink);
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Swatch */
    .swatch-frame {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      height: 220px;
      margin-bottom: 1.5rem;
      transition: background 0.4s ease;
      box-shadow: inset 0 0 0 1px rgba(28,24,20,0.08);
    }
    .domain-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(247,243,237,0.88);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink);
      padding: 4px 12px;
      border: 1px solid rgba(28,24,20,0.08);
    }
    .hex-badge {
      position: absolute;
      bottom: 14px;
      right: 14px;
      font-family: monospace;
      font-size: 12px;
      color: rgba(247,243,237,0.7);
      background: rgba(28,24,20,0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 6px;
      padding: 4px 10px;
      transition: opacity 0.2s;
    }
    .hex-badge.hidden { opacity: 0; }

    /* Clue */
    .clue {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--ink-muted);
      margin-bottom: 1.75rem;
      min-height: 60px;
    }
    .clue strong { color: var(--ink); font-style: normal; }

    /* Choices */
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .choice {
      font-family: var(--serif);
      font-size: 1.125rem;
      font-weight: 500;
      padding: 14px 18px;
      border: 1px solid rgba(28,24,20,0.15);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: left;
      color: var(--ink);
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .choice:hover { background: var(--cream-dark); border-color: rgba(28,24,20,0.25); }
    .choice:active { transform: scale(0.99); }
    .choice.correct { background: var(--green-light); border-color: var(--green); color: var(--green); }
    .choice.wrong { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .choice.disabled { pointer-events: none; }

    /* Feedback */
    .feedback {
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink-muted);
      min-height: 42px;
      margin-bottom: 1.25rem;
    }
    .feedback.win { color: var(--green); }
    .feedback.lose { color: var(--accent); }

    /* Next btn */
    .action-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn-primary {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      padding: 10px 22px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 99px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 400;
      padding: 10px 22px;
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid rgba(28,24,20,0.15);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-ghost:hover { background: var(--cream-dark); }
    .hidden { display: none !important; }

    /* ── Gallery mode ── */
    #gallery-mode { animation: fadeIn 0.25s ease; }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .filter-chip {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 99px;
      border: 1px solid rgba(28,24,20,0.15);
      background: transparent;
      color: var(--ink-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .filter-chip.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }
    .g-card {
      border-radius: 10px;
      border: 1px solid rgba(28,24,20,0.09);
      overflow: hidden;
      background: white;
      transition: transform 0.18s, box-shadow 0.18s;
      cursor: default;
    }
    .g-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(28,24,20,0.08); }
    .g-swatch { height: 80px; }
    .g-body { padding: 10px 12px 12px; }
    .g-name { font-family: var(--serif); font-size: 1rem; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
    .g-hex { font-family: monospace; font-size: 11px; color: var(--ink-faint); }
    .g-domain { font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); margin-top: 4px; }
    .g-clue { font-family: var(--serif); font-size: 0.82rem; font-style: italic; color: var(--ink-muted); margin-top: 6px; line-height: 1.5; border-top: 1px solid rgba(28,24,20,0.07); padding-top: 6px; }

    /* ── Shop mode ── */
    #shop-mode { animation: fadeIn 0.25s ease; }

    .shop-intro {
      margin-bottom: 1.75rem;
    }
    .shop-intro p {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .shop-card {
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(28,24,20,0.09);
      background: white;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .shop-card:hover { transform: translateY(-3px); border-color: var(--ink); box-shadow: 0 8px 24px rgba(28,24,20,0.1); }
    .shop-card:active { transform: scale(0.98); }
    .shop-swatch { aspect-ratio: 1; width: 100%; display: block; }
    .shop-price {
      padding: 10px 8px;
      text-align: center;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--gold);
    }
    .shop-empty {
      grid-column: 1 / -1;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-style: italic;
      color: var(--ink-muted);
      text-align: center;
      padding: 3rem 0;
    }
    .shop-action {
      margin-top: 20px;
      padding: 14px 18px;
      background: white;
      border: 1px solid rgba(28,24,20,0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeIn 0.15s ease;
    }
    .shop-action-msg {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      color: var(--ink-muted);
      flex: 1;
    }
    .shop-action-msg.error { color: var(--accent); }
    .shop-action-btns { display: flex; gap: 8px; }

    /* ── Purchase modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28,24,20,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 24px;
    }
    .modal-overlay.visible { opacity: 1; }
    .modal-box {
      background: var(--cream);
      border-radius: 18px;
      overflow: hidden;
      max-width: 460px;
      width: 100%;
      transform: translateY(28px) scale(0.97);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 32px 80px rgba(28,24,20,0.35);
    }
    .modal-overlay.visible .modal-box { transform: translateY(0) scale(1); }
    .modal-swatch { height: 200px; width: 100%; display: block; transition: height 0.3s; }
    .modal-body { padding: 28px 28px 24px; }
    .modal-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .modal-domain-chip {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-faint);
      background: var(--cream-dark);
      padding: 3px 10px;
      border-radius: 99px;
    }
    .modal-hex-text {
      font-family: monospace;
      font-size: 12px;
      color: var(--ink-faint);
    }
    .modal-name {
      font-family: var(--serif);
      font-size: 2.75rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.1;
      margin-bottom: 12px;
      animation: nameReveal 0.5s ease 0.1s both;
    }
    @keyframes nameReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-clue {
      font-family: var(--serif);
      font-size: 1rem;
      font-style: italic;
      line-height: 1.65;
      color: var(--ink-muted);
      margin-bottom: 18px;
      animation: nameReveal 0.5s ease 0.2s both;
    }
    .modal-congrats {
      font-size: 13px;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.02em;
      margin-bottom: 22px;
      animation: nameReveal 0.5s ease 0.3s both;
    }

    /* ── Footer ── */
    footer {
      padding: 1.5rem 0;
      border-top: 1px solid rgba(28,24,20,0.08);
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }

    /* ── Animations ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }
    .shake { animation: shake 0.4s ease; }

    @media (max-width: 520px) {
      .logo { font-size: 1.5rem; }
      .tagline { display: none; }
      .florin-badge { margin-left: auto; font-size: 12px; padding: 4px 10px; }
      .swatch-frame { height: 160px; }
      .choices { grid-template-columns: 1fr; }
      .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .modal-name { font-size: 2rem; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <span class="logo">Chrom<em>ata</em></span>
    <span class="tagline">Colors of art, fashion &amp; nature</span>
    <span class="florin-badge" id="florin-badge">ƒ <span id="florin-count">0</span></span>
    <div class="mode-tabs">
      <button class="tab-btn active" id="tab-quiz" onclick="setMode('quiz')">Quiz</button>
      <button class="tab-btn" id="tab-gallery" onclick="setMode('gallery')">Browse</button>
      <button class="tab-btn" id="tab-shop" onclick="setMode('shop')">Shop</button>
    </div>
  </header>

  <!-- Main -->
  <main>

    <!-- Quiz mode -->
    <div id="quiz-mode">
      <div class="meta-row">
        <span class="meta-chip">Score&nbsp; <strong id="score-val">0</strong></span>
        <span class="meta-chip"><strong id="q-num">1</strong> / <strong id="q-total">20</strong></span>
        <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:5%"></div></div>
      </div>

      <div class="swatch-frame" id="swatch">
        <span class="domain-badge" id="domain-badge">Art</span>
        <span class="hex-badge hidden" id="hex-badge">#000000</span>
      </div>

      <p class="clue" id="clue">Loading...</p>

      <div class="choices" id="choices"></div>

      <p class="feedback" id="feedback"></p>

      <div class="action-row">
        <button class="btn-primary hidden" id="next-btn" onclick="nextQ()">Next →</button>
        <button class="btn-ghost hidden" id="restart-btn" onclick="restartQuiz()">Play again</button>
        <button class="btn-ghost hidden" id="shop-btn" onclick="setMode('shop')">Visit Shop →</button>
      </div>
    </div>

    <!-- Gallery mode -->
    <div id="gallery-mode" class="hidden">
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all" onclick="filterGallery('all', this)">All</button>
        <button class="filter-chip" data-filter="Art" onclick="filterGallery('Art', this)">Art</button>
        <button class="filter-chip" data-filter="Fashion" onclick="filterGallery('Fashion', this)">Fashion</button>
        <button class="filter-chip" data-filter="Literature" onclick="filterGallery('Literature', this)">Literature</button>
        <button class="filter-chip" data-filter="Nature" onclick="filterGallery('Nature', this)">Nature</button>
      </div>
      <div class="gallery" id="gallery-grid"></div>
    </div>

    <!-- Shop mode -->
    <div id="shop-mode" class="hidden">
      <div class="shop-intro">
        <p>Six mystery colors for sale. Names and histories revealed on purchase.</p>
      </div>
      <div class="shop-grid" id="shop-grid"></div>
      <div id="shop-action" class="shop-action hidden">
        <span class="shop-action-msg" id="shop-action-msg"></span>
        <div class="shop-action-btns" id="shop-action-btns">
          <button class="btn-primary" onclick="confirmBuy()">Confirm</button>
          <button class="btn-ghost" onclick="cancelBuy()">Cancel</button>
        </div>
      </div>
    </div>

  </main>

  <footer id="footer-text">30 colors · art, fashion &amp; literature · chromata</footer>
</div>

<!-- Purchase fanfare modal -->
<div id="purchase-modal" class="modal-overlay hidden" onclick="closeFanfare()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-swatch" class="modal-swatch"></div>
    <div class="modal-body">
      <div class="modal-eyebrow">
        <span class="modal-domain-chip" id="modal-domain"></span>
        <span class="modal-hex-text" id="modal-hex"></span>
      </div>
      <h2 class="modal-name" id="modal-name"></h2>
      <p class="modal-clue" id="modal-clue"></p>
      <p class="modal-congrats" id="modal-congrats"></p>
      <button class="btn-primary" onclick="closeFanfare()">Add to collection</button>
    </div>
  </div>
</div>

<script>
const COLORS = [
  { name: "Vermilion",     hex: "#E34234", domain: "Art",                 clue: "A vivid red-orange used by masters like Turner and Titian" },
  { name: "Celadon",       hex: "#ACE1AF", domain: "Art",                 clue: "A pale green glaze prized in East Asian ceramics" },
  { name: "Carmine",       hex: "#960018", domain: "Art & Fashion",       clue: "A deep crimson extracted from cochineal insects" },
  { name: "Saffron",       hex: "#F4C430", domain: "Fashion",             clue: "A golden yellow associated with Buddhist robes and spice markets" },
  { name: "Ecru",          hex: "#C2B280", domain: "Fashion",             clue: "An unbleached linen tone — raw, warm, and neutral" },
  { name: "Cobalt",        hex: "#0047AB", domain: "Art",                 clue: "An intense blue made famous by Yves Klein" },
  { name: "Umber",         hex: "#635147", domain: "Art",                 clue: "A natural brown earth pigment, raw or burnt, beloved in oil painting" },
  { name: "Gamboge",       hex: "#E49B0F", domain: "Art",                 clue: "A resinous yellow-orange used in medieval manuscripts" },
  { name: "Aubergine",     hex: "#614051", domain: "Fashion",             clue: "A deep purple-black named after the eggplant" },
  { name: "Viridian",      hex: "#40826D", domain: "Art",                 clue: "A cool, transparent green made popular by the Impressionists" },
  { name: "Bisque",        hex: "#FFE4C4", domain: "Fashion",             clue: "A pale pinkish beige, soft as unglazed porcelain" },
  { name: "Chartreuse",    hex: "#7FFF00", domain: "Art & Fashion",       clue: "A yellow-green named after a French liqueur" },
  { name: "Puce",          hex: "#CC8899", domain: "Fashion",             clue: "A dusty mauve-pink — its name is French for 'flea'" },
  { name: "Scarlet",       hex: "#FF2400", domain: "Literature",          clue: "The bold red of a certain letter in Hawthorne's classic" },
  { name: "Cerulean",      hex: "#2A52BE", domain: "Art",                 clue: "A vivid sky blue described famously in The Devil Wears Prada" },
  { name: "Russet",        hex: "#80461B", domain: "Literature",          clue: "A reddish-brown worn by English peasants in medieval literature" },
  { name: "Amaranth",      hex: "#9F2B68", domain: "Literature",          clue: "An everlasting flower's purple-red, found in Greek myth and poetry" },
  { name: "Mauve",         hex: "#E0B0FF", domain: "Fashion",             clue: "The first synthetic dye, discovered in 1856, kicked off the purple fashion craze" },
  { name: "Titian",        hex: "#B5651D", domain: "Art",                 clue: "A reddish auburn named after the Venetian Renaissance painter" },

/* ─── State ─── */
let florins = 0;
let ownedShopColors = [];
let shopStock = [];

function loadState() {
  florins = parseInt(localStorage.getItem('chromata-florins') || '0');
  ownedShopColors = JSON.parse(localStorage.getItem('chromata-owned') || '[]');
  const storedNames = JSON.parse(localStorage.getItem('chromata-stock') || '[]');
  shopStock = storedNames
    .filter(n => !ownedShopColors.includes(n))
    .map(n => SHOP_COLORS.find(c => c.name === n))
    .filter(Boolean);
}

function saveState() {
  localStorage.setItem('chromata-florins', florins);
  localStorage.setItem('chromata-owned', JSON.stringify(ownedShopColors));
  localStorage.setItem('chromata-stock', JSON.stringify(shopStock.map(c => c.name)));
}

function getActiveColors() {
  const owned = SHOP_COLORS.filter(c => ownedShopColors.includes(c.name));
  return [...COLORS, ...owned];
}

function updateFlorinDisplay() {
  document.getElementById('florin-count').textContent = florins;
}

function updateFooter() {
  const n = getActiveColors().length;
  document.getElementById('footer-text').textContent =
    `${n} colors · art, fashion, literature & nature · chromata`;
}

/* ─── Helpers ─── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ─── Mode toggle ─── */
function setMode(m) {
  ['quiz', 'gallery', 'shop'].forEach(mode => {
    document.getElementById(mode + '-mode').classList.toggle('hidden', mode !== m);
    document.getElementById('tab-' + mode).classList.toggle('active', mode === m);
  });
  if (m === 'gallery') renderGallery('all');
  if (m === 'shop') renderShop();
  if (m !== 'shop') { pendingPurchase = null; document.getElementById('shop-action').classList.add('hidden'); }
}

/* ─── Gallery ─── */
function renderGallery(filter) {
  const all = getActiveColors();
  const list = filter === 'all' ? all : all.filter(c => c.domain.includes(filter));
  const sorted = [...list].sort((a, b) => a.name.localeCompare(b.name));
  document.getElementById('gallery-grid').innerHTML = sorted.map(c => `
    <div class="g-card">
      <div class="g-swatch" style="background:${c.hex}"></div>
      <div class="g-body">
        <div class="g-name">${c.name}</div>
        <div class="g-hex">${c.hex}</div>
        <div class="g-domain">${c.domain}</div>
        <div class="g-clue">${c.clue}</div>
      </div>
    </div>
  `).join('');
}

function filterGallery(f, el) {
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGallery(f);
}

/* ─── Shop ─── */
function ensureShopStock() {
  if (shopStock.length === 0) {
    const available = SHOP_COLORS.filter(c => !ownedShopColors.includes(c.name));
    shopStock = shuffle(available).slice(0, 6);
    saveState();
  }
}

function renderShop() {
  ensureShopStock();
  document.getElementById('shop-action').classList.add('hidden');
  const grid = document.getElementById('shop-grid');
  if (shopStock.length === 0) {
    grid.innerHTML = '<p class="shop-empty">You\'ve collected every color in the shop. Your palette is complete.</p>';
    return;
  }
  grid.innerHTML = shopStock.map(c =>
    `<div class="shop-card" onclick="tapShopCard('${c.name.replace(/'/g, "\\'")}')">
      <div class="shop-swatch" style="background:${c.hex}"></div>
      <div class="shop-price">ƒ ${c.price}</div>
    </div>`
  ).join('');
}

let pendingPurchase = null;

function tapShopCard(name) {
  const color = SHOP_COLORS.find(c => c.name === name);
  pendingPurchase = null;
  const actionEl = document.getElementById('shop-action');
  const msgEl = document.getElementById('shop-action-msg');
  const btnsEl = document.getElementById('shop-action-btns');

  if (florins < color.price) {
    const need = color.price - florins;
    msgEl.textContent = `You need ƒ${need} more to buy this color.`;
    msgEl.className = 'shop-action-msg error';
    btnsEl.classList.add('hidden');
    const badge = document.getElementById('florin-badge');
    badge.classList.remove('shake');
    void badge.offsetWidth;
    badge.classList.add('shake');
  } else {
    pendingPurchase = color;
    msgEl.textContent = `Spend ƒ${color.price} on this mystery color?`;
    msgEl.className = 'shop-action-msg';
    btnsEl.classList.remove('hidden');
  }
  actionEl.classList.remove('hidden');
}

function confirmBuy() {
  if (!pendingPurchase) return;
  const color = pendingPurchase;
  pendingPurchase = null;
  document.getElementById('shop-action').classList.add('hidden');

  florins -= color.price;
  ownedShopColors.push(color.name);

  const stockIdx = shopStock.findIndex(c => c.name === color.name);
  const available = SHOP_COLORS.filter(c =>
    !ownedShopColors.includes(c.name) &&
    !shopStock.some(s => s.name === c.name)
  );
  if (available.length > 0) {
    shopStock[stockIdx] = shuffle(available)[0];
  } else {
    shopStock.splice(stockIdx, 1);
  }

  saveState();
  updateFlorinDisplay();
  updateFooter();
  showPurchaseFanfare(color);
}

function cancelBuy() {
  pendingPurchase = null;
  document.getElementById('shop-action').classList.add('hidden');
}

function showPurchaseFanfare(color) {
  document.getElementById('modal-swatch').style.background = color.hex;
  document.getElementById('modal-domain').textContent = color.domain;
  document.getElementById('modal-hex').textContent = color.hex;
  document.getElementById('modal-name').textContent = color.name;
  document.getElementById('modal-clue').textContent = color.clue;
  document.getElementById('modal-congrats').textContent =
    color.price >= 45 ? 'A truly rare acquisition — your collection is the richer for it.' :
    color.price >= 35 ? 'A beautiful and distinguished addition to your collection.' :
    color.price >= 25 ? 'A fine new color joins your collection.' :
                        'A new color joins your collection.';

  const modal = document.getElementById('purchase-modal');
  modal.classList.remove('hidden');
  void modal.offsetWidth;
  modal.classList.add('visible');
}

function closeFanfare() {
  const modal = document.getElementById('purchase-modal');
  modal.classList.remove('visible');
  setTimeout(() => {
    modal.classList.add('hidden');
    renderShop();
  }, 320);
}

/* ─── Quiz ─── */
let order = [], idx = 0, results = [], answered = false;

function startQuiz() {
  const active = getActiveColors();
  order = shuffle(active).slice(0, 20);
  idx = 0; results = []; answered = false;
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.add('hidden');
  document.getElementById('shop-btn').classList.add('hidden');
  renderQ();
}

function renderQ() {
  const c = order[idx];
  answered = false;

  document.getElementById('swatch').style.background = c.hex;
  document.getElementById('domain-badge').textContent = c.domain;
  document.getElementById('hex-badge').textContent = c.hex;
  document.getElementById('hex-badge').classList.add('hidden');
  document.getElementById('clue').innerHTML = c.clue;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('q-num').textContent = idx + 1;
  document.getElementById('q-total').textContent = order.length;
  document.getElementById('score-val').textContent = results.filter(Boolean).length;
  document.getElementById('prog-fill').style.width = Math.max(5, Math.round((idx / order.length) * 100)) + '%';

  const active = getActiveColors();
  const others = shuffle(active.filter(x => x.name !== c.name)).slice(0, 3);
  const pool = shuffle([c, ...others]);
  document.getElementById('choices').innerHTML = pool.map(o =>
    `<button class="choice" onclick="guess('${o.name.replace(/'/g, "\\'")}')">
       ${o.name}
     </button>`
  ).join('');
}

function guess(name) {
  if (answered) return;
  answered = true;
  const c = order[idx];
  const correct = name === c.name;
  results.push(correct);

  document.getElementById('hex-badge').classList.remove('hidden');

  document.querySelectorAll('.choice').forEach(b => {
    const bName = b.textContent.trim();
    b.classList.add('disabled');
    if (bName === c.name) b.classList.add('correct');
    else if (bName === name && !correct) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (correct) {
    fb.textContent = `Correct! ${c.name} — ${c.clue}`;
    fb.className = 'feedback win';
  } else {
    fb.textContent = `That's ${c.name}. ${c.clue}`;
    fb.className = 'feedback lose';
  }

  document.getElementById('score-val').textContent = results.filter(Boolean).length;

  if (idx < order.length - 1) {
    document.getElementById('next-btn').classList.remove('hidden');
  } else {
    showFinal();
  }
}

function nextQ() {
  idx++;
  document.getElementById('next-btn').classList.add('hidden');
  renderQ();
}

function showFinal() {
  const right = results.filter(Boolean).length;
  const total = results.length;
  const pct = Math.round(right / total * 100);
  const msg = pct >= 90 ? 'Palette master.' : pct >= 70 ? 'Sharp eye.' : pct >= 50 ? 'Keep mixing.' : 'Keep exploring.';

  const earned = right;
  florins += earned;
  saveState();
  updateFlorinDisplay();

  document.getElementById('choices').innerHTML = '';
  document.getElementById('clue').innerHTML = '';
  document.getElementById('feedback').innerHTML = `
    <div style="text-align:center; padding: 2.5rem 0;">
      <div style="font-family:var(--serif); font-size:5rem; font-weight:600; line-height:1; color:var(--ink);">
        ${right}<span style="font-size:2rem; color:var(--ink-faint)">/${total}</span>
      </div>
      <div style="font-family:var(--serif); font-style:italic; font-size:1.1rem; color:var(--ink-muted); margin-top:0.5rem;">
        ${pct}% correct &mdash; ${msg}
      </div>
      <div style="margin-top:1.25rem; font-size:1rem; font-weight:500; color:var(--gold);">
        +ƒ${earned} earned &nbsp;·&nbsp; ƒ${florins} total
      </div>
    </div>
  `;
  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('restart-btn').classList.remove('hidden');
  document.getElementById('shop-btn').classList.remove('hidden');
}

function restartQuiz() {
  document.getElementById('choices').innerHTML = '';
  document.getElementById('shop-btn').classList.add('hidden');
  startQuiz();
}

/* ─── Init ─── */
loadState();
updateFlorinDisplay();
updateFooter();
startQuiz();
</script>
